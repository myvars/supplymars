name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        concurrency:
            group: ci-test-${{ github.ref }}
            cancel-in-progress: true

        env:
            # compose.ci.yaml adds the build cache; the make targets pick these files up
            COMPOSE_FILE: compose.yaml:compose.override.yaml:compose.ci.yaml

        # Each step is one step of `make check`, the same commands it runs
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Check production config
              run: make check-prod-config

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            # Gives `docker compose build` the credentials for the GitHub Actions cache
            - name: Expose GitHub runtime
              uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

            - name: Build containers
              run: docker compose --progress=plain build php

            - name: Check code style
              run: make check-cs

            - name: Check Rector
              run: make check-rector

            - name: Run static analysis
              run: make check-phpstan

            - name: Check dependencies between contexts
              run: make check-deptrac

            - name: Lint container, Twig and YAML
              run: make check-lint

            - name: Audit dependencies
              run: make check-audit

            - name: Check migrations match the entities
              run: make check-migrations

            - name: Run tests
              run: make check-tests

    # Builds the php (which messenger also runs) and reset production images and pushes them to
    # GHCR, tagged with the commit SHA. The server pulls them; it never builds. See Docs/11-runbook.md.
    publish:
        needs: test
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        env:
            COMPOSE_FILE: compose.yaml:compose.prod.yaml:compose.publish.yaml
            COMPOSE_PROFILES: playground
            IMAGE_TAG: ${{ github.sha }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Expose GitHub runtime
              uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

            - name: Log in to GHCR
              env:
                  TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            - name: Build production images
              run: docker compose --progress=plain build php reset

            - name: Push production images
              run: docker compose push php reset

    deploy:
        needs: publish
        runs-on: ubuntu-latest
        concurrency:
            group: ci-deploy
            cancel-in-progress: false

        # App secrets are not GitHub secrets: the env files are already on the server
        steps:
            - name: Deploy to AWS Lightsail
              uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  command_timeout: 10m
                  script: |
                      set -e
                      cd /home/ubuntu/supplymars

                      # The checkout supplies the compose files and Makefile, and its commit picks
                      # the image tag; the code is in the images
                      git fetch origin
                      # A newer commit's run may have deployed first; never go back to an older one
                      if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ] && git merge-base --is-ancestor ${{ github.sha }} HEAD; then
                          echo "A newer commit is already deployed; skipping."
                          exit 0
                      fi
                      git reset --hard ${{ github.sha }}
                      git clean -fd

                      mkdir -p /home/ubuntu/supplymars-backups

                      make up-prod-live
                      make up-prod-playground
                      make verify-prod-live
                      make verify-prod-playground
