name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        concurrency:
            group: ci-test-${{ github.ref }}
            cancel-in-progress: true

        env:
            # compose.ci.yaml adds the build cache; the make targets pick these files up
            COMPOSE_FILE: compose.yaml:compose.override.yaml:compose.ci.yaml

        # Each step is one step of `make check`, the same commands it runs
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Check production config
              run: make check-prod-config

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            # Gives `docker compose build` the credentials for the GitHub Actions cache
            - name: Expose GitHub runtime
              uses: crazy-max/ghaction-github-runtime@v4

            - name: Build containers
              run: docker compose --progress=plain build php

            - name: Check code style
              run: make check-cs

            - name: Check Rector
              run: make check-rector

            - name: Run static analysis
              run: make check-phpstan

            - name: Lint container, Twig and YAML
              run: make check-lint

            - name: Audit dependencies
              run: make check-audit

            - name: Check migrations match the entities
              run: make check-migrations

            - name: Run tests
              run: make check-tests

    deploy:
        needs: test
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest
        concurrency:
            group: ci-deploy
            cancel-in-progress: false

        steps:
            - name: Deploy to AWS Lightsail
              uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  command_timeout: 20m
                  script: |
                      cd /home/ubuntu/supplymars
                      git fetch origin
                      git reset --hard origin/main
                      git clean -fd

                      mkdir -p /home/ubuntu/supplymars-backups

                      echo "Starting live stack..."
                      docker compose --env-file ../supplymars-secrets/live.env -p supplymars-live -f compose.yaml -f compose.prod.yaml up -d --build --remove-orphans --wait

                      echo "Starting playground stack..."
                      docker compose --env-file ../supplymars-secrets/playground.env -p supplymars-playground --profile playground -f compose.yaml -f compose.prod.yaml up -d --build --remove-orphans --wait

                      echo "Running post-deploy smoke tests..."
                      curl -sf -o /dev/null --retry 3 --retry-delay 5 http://localhost:8001
                      curl -sf -o /dev/null --retry 3 --retry-delay 5 http://localhost:8002
                      docker compose --env-file ../supplymars-secrets/live.env -p supplymars-live -f compose.yaml -f compose.prod.yaml exec -T php php bin/console doctrine:migrations:up-to-date
                      docker compose --env-file ../supplymars-secrets/playground.env -p supplymars-playground -f compose.yaml -f compose.prod.yaml exec -T php php bin/console doctrine:migrations:up-to-date
                      echo "Smoke tests passed."
