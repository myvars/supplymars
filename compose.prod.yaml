# ========================================
# Docker Compose: Production configuration
# ========================================
# Used by both Live and Playground stacks. Differences controlled via env vars.
# CI builds the php and reset images, tagged with the commit SHA, and pushes them to GHCR; php
# runs both the php and messenger services. The server pulls and starts them (make up-prod-live, make up-prod-playground) and never
# builds. IMAGE_TAG is the commit SHA to run ("local" for a build on your own machine).

x-common-logging: &common-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common-php-env: &common-php-env
  APP_SECRET: ${APP_SECRET}                               # Production app secret
  DEFAULT_DOMAIN: ${DEFAULT_DOMAIN}                       # Production domain
  DEFAULT_URI: ${DEFAULT_URI}                             # Production URL (e.g., https://www.supplymars.com)
  DATABASE_URL: ${DATABASE_URL}                           # Full DB connection string (use app user)
  REDIS_URL: ${REDIS_URL}                                 # Redis for the cache and sessions, with REDIS_PASSWORD
  MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default}   # Queue: a database table unless set
  MAILER_DSN: ${MAILER_DSN}                               # Mailer DSN (e.g., SMTP for real mail delivery)
  MAILER_FROM: ${MAILER_FROM}                             # Sender address (e.g., no-reply@supplymars.com)
  AWS_S3_REGION: ${AWS_S3_REGION}                         # AWS S3 region for uploads
  AWS_S3_BUCKET: ${AWS_S3_BUCKET}                         # S3 bucket name
  AWS_S3_ACCESS_ID: ${AWS_S3_ACCESS_ID}                   # AWS S3 access key ID
  AWS_S3_SECRET_ACCESS_KEY: ${AWS_S3_SECRET_ACCESS_KEY}   # AWS S3 secret access key
  AWS_S3_PRODUCTS_PREFIX: ${AWS_S3_PRODUCTS_PREFIX:-}     # S3 key prefix (empty for live, "playground" for playground)
  UPLOADS_BASE_URL: ${UPLOADS_BASE_URL}                   # Base URL for uploaded files (includes prefix for playground)
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}               # Turnstile key
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}           # Turnstile secret
  REDIS_PASSWORD: ${REDIS_PASSWORD}                       # Redis auth password
  PLAYGROUND_MODE: ${PLAYGROUND_MODE:-false}               # Show playground banner and behavior
  SENTRY_DSN: ${SENTRY_DSN:-}                             # Sentry error tracking (optional: empty sends nothing)
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-live}         # Sentry environment: "live" or "playground"

services:
  # --- MySQL Database (Prod) ---
  database:
    logging: *common-logging
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"   # Localhost only (for SSH tunnel + PhpMyAdmin)
    environment:
      MYSQL_USER: app                               # App-specific DB user (never root in prod)
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}             # Secure, unique app password
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}   # Used for root access only (never in app)


  # --- Redis (Prod) ---
  redis:
    logging: *common-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}    # Required: Redis refuses to start without it (compose.yaml)


  # --- RabbitMQ Message Broker (only with the rabbitmq profile) ---
  rabbitmq:
    logging: *common-logging
    expose:
      - "5672"  # Expose RabbitMQ AMQP port internally (not to host)
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq


  # --- PHP Application (Prod) ---
  php:
    logging: *common-logging
    image: ghcr.io/myvars/supplymars/php:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: php-prod
    environment:
      <<: *common-php-env
      RUN_MIGRATIONS: "true"  # Only php container runs migrations/messenger-setup
      SERVER_NAME: ":80"      # Plain HTTP; Caddy on the host terminates TLS
      # Worker mode: the app stays in memory between requests, so services must keep no request's data
      # in a property (Docs/03-architecture.md). Each worker restarts after 500 requests, Symfony's default
      FRANKENPHP_CONFIG: "worker /app/public/index.php"
      FRANKENPHP_LOOP_MAX: "500"
    # Localhost only; Caddy on the host proxies to this port (live 8001, playground 8002). Replaces dev's 80 and 443.
    ports: !override
      - "127.0.0.1:${HTTP_HOST_PORT:-8001}:80"
    # No code mounts—built artifacts only; code changes require a new image. No Caddy volumes either:
    # without TLS there are no certificates to keep.
    volumes: !reset []
    healthcheck:
      # Passes when FrankenPHP, the database, Redis and the queue all respond
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]


  # --- Messenger Worker (Prod) ---
  messenger:
    logging: *common-logging
    image: ghcr.io/myvars/supplymars/php:${IMAGE_TAG:-local}   # Same image as php
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: php-prod
    environment:
      <<: *common-php-env
    # Also runs the scheduled jobs (src/Shared/Infrastructure/Scheduler/MainSchedule.php; PLAYGROUND_MODE
    # picks the stack's). The scheduler comes first: the worker goes back to the first receiver after
    # each message, and it only returns jobs that are due. The memory limit (under PHP's 256M) stops the
    # worker cleanly between jobs, as one worker now runs every command for up to an hour
    command: sh -c "php bin/console messenger:consume scheduler_default async --time-limit=3600 --memory-limit=192M --sleep=5"
    # The worker cannot catch SIGTERM (no pcntl), so a stop or a deploy waits this long, then kills it.
    # Short, so a deploy is not held up: a job killed mid-run has not advanced the schedule and runs
    # again when the worker is back, and a message killed mid-handling is redelivered later (ADR 015)
    stop_grace_period: 30s
    volumes:
      # Live's nightly backup writes latest.sql.gz here for the playground reset. The worker runs as
      # www-data (uid 33), which must own the host directory (Docs/11-runbook.md)
      - /home/ubuntu/supplymars-backups:/backups


  # --- Playground Reset (nightly DB clone from live) ---
  reset:
    profiles: ["playground"]
    logging: *common-logging
    image: ghcr.io/myvars/supplymars/reset:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: playground-reset
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /home/ubuntu/supplymars-backups:/backups:ro
    environment:
      <<: *common-php-env
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: /bin/sh -c 'printenv | grep -v "no_proxy" > /etc/environment && cron -f'
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[c]ron -f'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped


# --- Prod Volumes ---
volumes:
  rabbitmq_data:    # RabbitMQ data (only created with the rabbitmq profile)
