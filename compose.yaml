# ===============================
# Docker Compose
# ===============================
# Defines core services for Symfony dev stack.
# See compose.prod.yaml & .prod.local.yaml for production overrides.

services:
  # --- MySQL Database ---
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-app}   # Set in .env; production env files leave it unset
      # Default username/pw set in .env
    volumes:
      - db-data:/var/lib/mysql  # Persist DB data between restarts
    healthcheck:
      # Wait for MySQL to be ready
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped


  # --- Redis: app cache and sessions ---
  # The image ignores REDIS_PASSWORD, so the command passes it to requirepass. Refuses to start when it is
  # empty. Each client's REDIS_URL must carry the same password. Runs through the image's entrypoint,
  # which drops to the redis user.
  redis:
    image: redis:8.8-alpine
    command: [ "sh", "-c", ': "$${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"; exec docker-entrypoint.sh redis-server --requirepass "$$REDIS_PASSWORD"' ]
    volumes:
      - redis_data:/data  # Persist redis data between restarts
    healthcheck:
      # Passes only with the password: an unauthenticated ping gets NOAUTH, and redis-cli still exits 0
      test: [ "CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG' ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped


  # --- RabbitMQ Message Broker ---
  # Opt-in: the queue is a database table by default. Starts only with the rabbitmq profile
  # (COMPOSE_PROFILES=rabbitmq). See "Switching to RabbitMQ" in Docs/02-setup-local.md.
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    profiles: [ rabbitmq ]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped


  # --- PHP Application (FrankenPHP: web server and PHP in one) ---
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: php-dev
    depends_on:
      database:
        condition: service_healthy  # Only start when DB is healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
        required: false   # Only waited for when the rabbitmq profile is on
    environment:
      RUN_MIGRATIONS: "true"  # Only php container runs migrations/messenger-setup
      SERVER_NAME: localhost  # HTTPS from Caddy's local certificate authority (docker/frankenphp/Caddyfile)
    ports:
      - "80:80"         # HTTP, redirects to HTTPS
      - "443:443"       # HTTPS
      - "443:443/udp"   # HTTP/3
    volumes:
      - caddy_data:/data      # Caddy's local CA and certificates, kept so the browser trusts them across restarts
      - caddy_config:/config
    healthcheck:
      # Passes when FrankenPHP, the database, Redis and the queue all respond
      test: [ "CMD", "curl", "-kf", "https://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped


  # --- Symfony Messenger/Worker ---
  messenger:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: php-dev
    depends_on:
      php:
        condition: service_healthy  # Wait for php to finish setup
    # Only the async queue: scheduled jobs (scheduler_default) run in production only, see compose.prod.yaml
    command: sh -c "php bin/console messenger:consume async --time-limit=3600 --sleep=5"
    healthcheck:
      # Checks the messenger is running
      test: ["CMD-SHELL", "ps aux | grep -q '[m]essenger:consume'"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped


# --- Volumes ---
volumes:
  db-data:  # MySQL data
  redis_data: # Redis data
  caddy_data:   # Caddy's certificates (local CA in development)
  caddy_config: # Caddy's saved configuration
