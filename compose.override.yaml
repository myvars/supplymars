# ===============================
# Docker Compose: Development configuration
# ===============================
# Overrides for local development: mounts, Xdebug, Mailer, PHPMyAdmin, etc.
# `make up` starts every service; `make up-dev-tools` starts the ones it names (database, redis, mailer and
# the three phpMyAdmins). Published ports and the database name come from the docker block in .env.

x-common-php-env: &common-php-env
  DEFAULT_URI: "https://localhost"
  DATABASE_URL: "mysql://root:password@database:3306/${DATABASE_NAME:-app}?serverVersion=8.4&charset=utf8mb4"
  REDIS_URL: "redis://default:password@redis:6379"
  MAILER_DSN: "smtp://mailer:1025"
  MESSENGER_TRANSPORT_DSN: "doctrine://default"

services:
  # --- MySQL Database (Dev) ---
  database:
    ports:
      - "127.0.0.1:${DATABASE_PORT:-3306}:3306"   # Expose for dev tools (localhost only).
    environment:
      MYSQL_ROOT_PASSWORD: password   # Dev root pw (never use in prod!)


  # --- Redis (Dev) ---
  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"   # Localhost only
    environment:
      REDIS_PASSWORD: password    # Dev pw (never use in prod!); REDIS_URL above carries it
    labels:
      # symfony serve would export its own REDIS_URL for this service, without the password, over .env's
      com.symfony.server.service-ignore: true


  # --- RabbitMQ (Dev, only with the rabbitmq profile) ---
  rabbitmq:
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"         # AMQP protocol (localhost only)
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"    # RabbitMQ Management UI (localhost only)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest


# --- PHP Application (Dev) ---
  php:
    environment:
      <<: *common-php-env
      XDEBUG_MODE: ${XDEBUG_MODE:-off}    # Enable Xdebug if desired (export XDEBUG_MODE=debug)
    volumes:
      - ./docker/php/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro  # Dev PHP config
      - .:/app              # Mount project source (for instant code reload)
      - app-var:/app/var    # Dedicated volume for var/ (cache/logs)
    extra_hosts:
      - host.docker.internal:host-gateway   # For talking to host from container


  # --- Messenger Worker (Dev) ---
  messenger:
    environment:
      <<: *common-php-env
      SKIP_ASSET_BUILD: "true"  # Messenger doesn't serve HTTP; email CSS uses source files
    volumes:
      - .:/app                    # Mount source for code reload
      - messenger-var:/app/var    # Dedicated volume for var/ (cache/logs)


  # --- PhpMyAdmin (Dev Tool) ---
  phpmyadmin:
    image: phpmyadmin
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8080}:80"   # http://localhost:8080 by default
    environment:
      PMA_HOST: database
    restart: unless-stopped


  # --- PhpMyAdmin for the live database (needs an SSH tunnel to local port 3307) ---
  phpmyadmin-prod-live:
    extends: phpmyadmin
    depends_on: !reset {}
    ports: !override
      - "127.0.0.1:${PHPMYADMIN_LIVE_PORT:-8081}:80"   # http://localhost:8081 by default
    environment:
      PMA_HOST: host.docker.internal
      PMA_PORT: 3307
    volumes:
      - ./docker/phpmyadmin/live-custom-footer.php:/var/www/html/config.footer.inc.php


  # --- PhpMyAdmin for the playground database (needs an SSH tunnel to local port 3308) ---
  phpmyadmin-prod-playground:
    extends: phpmyadmin
    depends_on: !reset {}
    ports: !override
      - "127.0.0.1:${PHPMYADMIN_PLAYGROUND_PORT:-8082}:80"   # http://localhost:8082 by default
    environment:
      PMA_HOST: host.docker.internal
      PMA_PORT: 3308
    volumes:
      - ./docker/phpmyadmin/playground-custom-footer.php:/var/www/html/config.footer.inc.php


  # --- Mailpit (Dev SMTP capture) ---
  ###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:${MAILER_PORT:-1025}:1025"    # SMTP for app to deliver to Mailpit (localhost only)
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"   # Web UI for inspecting mails (localhost only)
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
  ###< symfony/mailer ###


# --- Dev Cache/Log Volumes for each container ---
volumes:
  app-var:          # Dedicated to main php container
  messenger-var:    # Messenger service isolation
