framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # A database table by default. RabbitMQ is an opt-in: see Docs/adr/013-database-queue-by-default.md
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    auto_setup: true  # The queue is created on first use if it is missing
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: [ ]

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async
            'App\Shared\Domain\Event\AsyncDomainEventInterface': async

when@test:
    framework:
        messenger:
            transports:
                # Messages are kept in memory, so tests need no queue and can assert on what was sent.
                # Serialized, as the real queue does, so a message or stamp that cannot be stored fails here
                async: 'in-memory://?serialize=true'
