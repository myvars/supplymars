when@prod:
    sentry:
        dsn: '%env(SENTRY_DSN)%'
        # Error tracking only. Without this the bundle wraps the database, cache, Twig
        # and HTTP client for performance tracing even when no DSN is set.
        tracing:
            enabled: false
        options:
            # live or playground: both stacks run APP_ENV=prod and can share one Sentry project
            environment: '%env(SENTRY_ENVIRONMENT)%'
            # Add request headers, cookies, IP address and the authenticated user
            # see https://docs.sentry.io/platforms/php/data-management/data-collected/ for more info
            # send_default_pii: true
            ignore_exceptions:
                - 'Symfony\Component\ErrorHandler\Error\FatalError'
                - 'Symfony\Component\Debug\Exception\FatalErrorException'
                # Expected responses, not faults: 404s and other HTTP errors, and the
                # "access denied" that sends an anonymous visitor to the login page.
                - 'Symfony\Component\HttpKernel\Exception\HttpExceptionInterface'
                - 'Symfony\Component\Security\Core\Exception\AccessDeniedException'
#
#        # If you are using Monolog, you also need this additional configuration to log the errors correctly:
#        # https://docs.sentry.io/platforms/php/guides/symfony/integrations/monolog/
