# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # In production the host Caddy proxies every request. Trusting it makes getClientIp() the visitor's
    # (rate limits, login_throttling) and makes URLs https when the visitor used HTTPS. See ADR 016.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto']

    # Note that the session will be started ONLY if you read or write from it.
    # Sessions are in Redis in every environment, symfony serve included (make up-dev-tools starts it)
    session:
        handler_id: '%env(REDIS_URL)%'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
