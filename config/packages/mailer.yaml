framework:
    mailer:
        dsn: '%env(MAILER_DSN)%'
        envelope:
            sender: '%env(MAILER_FROM)%'
        headers:
            From: '%env(DEFAULT_DOMAIN)% <%env(MAILER_FROM)%>'

when@prod:
    framework:
        mailer:
            headers:
                Bcc: 'admin-bcc@supplymars.com'

when@dev:
    framework:
        mailer:
            envelope:
                recipients: ['%env(DEV_MAIL_RECIPIENT)%']

