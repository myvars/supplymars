when@dev:
    nelmio_api_doc:
        documentation:
            info:
                title: 'SupplyMars API'
                description: 'REST API for the SupplyMars application'
                version: '1.0.0'
            components:
                securitySchemes:
                    Bearer:
                        type: http
                        scheme: bearer
                        description: 'API token authentication. Pass your token in the Authorization header.'
            security:
                -   Bearer: [ ]
        areas:
            path_patterns:
                - '^/api/'

# Swagger UI's files are inlined into /api/doc (about 2 MB), not loaded from a CDN the Content
# Security Policy blocks. assets_mode: bundle would let them be cached, but the production image has
# no public/bundles/ (composer install --no-scripts, and .dockerignore leaves it out).
nelmio_api_doc:
    html_config:
        assets_mode: offline
