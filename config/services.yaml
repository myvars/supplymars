# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.product_uploads: 'uploads/products/'
    app.uploads_base_url: '%env(DEFAULT_URI)%'
    # A week, in seconds: the remember-me cookie, and the Mercure subscriber cookie that follows it
    app.login_lifetime: 604800

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # FormFlow port -> app adapter (myvars/form-flow bundle)
    MyVars\FormFlow\Contract\FlasherInterface: '@App\Shared\UI\Http\FlashMessenger'

    App\Customer\UI\Http\Controller\RegistrationController:
        bind:
            $registrationLimiter: '@limiter.registration'

    App\Shared\UI\Http\Validation\TurnstileValidator:
        arguments:
            $turnstileSecretKey: '%env(TURNSTILE_SECRET_KEY)%'
            $kernelEnvironment: '%kernel.environment%'

    App\Shared\UI\Http\Form\Type\TurnstileType:
        arguments:
            $turnstileSiteKey: '%env(TURNSTILE_SITE_KEY)%'

    Aws\S3\S3Client:
        arguments:
            - version: 'latest'
              region: "%env(AWS_S3_REGION)%"
              credentials:
                  key: "%env(AWS_S3_ACCESS_ID)%"
                  secret: "%env(AWS_S3_SECRET_ACCESS_KEY)%"

    # Messenger's deduplication locks in Redis, shared by php and messenger (config/packages/lock.yaml). The other
    # locks (the scheduler, the backup and prune commands, the rate limiter) stay on the default store
    messenger.middleware.deduplicate_middleware:
        class: Symfony\Component\Messenger\Middleware\DeduplicateMiddleware
        arguments: ['@lock.deduplication.factory']
    messenger.failure.release_deduplication_lock_on_failure_listener:
        class: Symfony\Component\Messenger\EventListener\ReleaseDeduplicationLockOnFailureListener
        arguments: ['@lock.deduplication.factory']

    Faker\Generator:
        factory: [ 'Faker\Factory', 'create' ]
        arguments: [ 'en_GB' ]

when@prod:
    parameters:
        app.uploads_base_url: '%env(UPLOADS_BASE_URL)%'

when@test:
    services:
        # Records published updates instead of sending them (tests/Shared/Mercure/RecordingHub.php)
        App\Tests\Shared\Mercure\RecordingHub:
            decorates: mercure.hub.default
            arguments: ['@.inner']
            public: true
