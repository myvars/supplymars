# Dependency rules between bounded contexts. See Docs/03-architecture.md and Docs/adr/014-architecture-rules.md.
#
# Each context is split into two layers:
#   "{Context} Domain"    – src/{Context}/Domain: entities, enums, value objects, events, repository interfaces
#   "{Context} internals" – everything else: Application, Infrastructure, UI
# A context may use its own layers, Shared, and the Domain layer of any other context.
# Shared may use nothing outside Shared.
# A new context needs its two layers here, its Domain layer added to every list in the ruleset, and its name
# added to the Unregistered pattern. Until then its classes are Unregistered and every import to or from them fails.
deptrac:
  cache_file: var/cache/.deptrac.cache
  paths:
    - ./src
  layers:
    - name: Shared
      collectors:
        - { type: classLike, value: ^App\\Shared\\ }

    - name: Audit Domain
      collectors:
        - { type: classLike, value: ^App\\Audit\\Domain\\ }
    - name: Audit internals
      collectors:
        - { type: classLike, value: ^App\\Audit\\(?!Domain\\) }

    - name: Catalog Domain
      collectors:
        - { type: classLike, value: ^App\\Catalog\\Domain\\ }
    - name: Catalog internals
      collectors:
        - { type: classLike, value: ^App\\Catalog\\(?!Domain\\) }

    - name: Customer Domain
      collectors:
        - { type: classLike, value: ^App\\Customer\\Domain\\ }
    - name: Customer internals
      collectors:
        - { type: classLike, value: ^App\\Customer\\(?!Domain\\|Infrastructure\\Security\\(CurrentUserProvider|DefaultUserAuthenticator)$) }
    # Exception: every context needs the signed-in user, so Customer publishes the service that reads it, and the
    # one the simulation commands use to sign in the default staff user.
    - name: Current user
      collectors:
        - { type: classLike, value: ^App\\Customer\\Infrastructure\\Security\\(CurrentUserProvider|DefaultUserAuthenticator)$ }

    - name: Note Domain
      collectors:
        - { type: classLike, value: ^App\\Note\\Domain\\ }
    - name: Note internals
      collectors:
        - { type: classLike, value: ^App\\Note\\(?!Domain\\) }

    - name: Order Domain
      collectors:
        - { type: classLike, value: ^App\\Order\\Domain\\ }
    - name: Order internals
      collectors:
        - { type: classLike, value: ^App\\Order\\(?!Domain\\) }

    - name: Pricing Domain
      collectors:
        - { type: classLike, value: ^App\\Pricing\\Domain\\ }
    - name: Pricing internals
      collectors:
        - { type: classLike, value: ^App\\Pricing\\(?!Domain\\) }

    - name: Purchasing Domain
      collectors:
        - { type: classLike, value: ^App\\Purchasing\\Domain\\ }
    - name: Purchasing internals
      collectors:
        - { type: classLike, value: ^App\\Purchasing\\(?!Domain\\) }

    - name: Reporting Domain
      collectors:
        - { type: classLike, value: ^App\\Reporting\\Domain\\ }
    - name: Reporting internals
      collectors:
        - { type: classLike, value: ^App\\Reporting\\(?!Domain\\) }

    - name: Review Domain
      collectors:
        - { type: classLike, value: ^App\\Review\\Domain\\ }
    - name: Review internals
      collectors:
        - { type: classLike, value: ^App\\Review\\(?!Domain\\) }

    # Home has no Domain/, so it has one layer and nothing else may use it.
    - name: Home internals
      collectors:
        - { type: classLike, value: ^App\\Home\\ }

    # Any class in a context not listed above. It has no ruleset entry, so it may use nothing and nothing may use it.
    - name: Unregistered
      collectors:
        - { type: classLike, value: ^App\\(?!Shared\\|Audit\\|Catalog\\|Customer\\|Note\\|Order\\|Pricing\\|Purchasing\\|Reporting\\|Review\\|Home\\|Kernel$) }

  ruleset:
    Shared: ~

    Audit Domain: [Audit internals, Shared, Catalog Domain, Customer Domain, Note Domain, Order Domain, Pricing Domain, Purchasing Domain, Reporting Domain, Review Domain, Current user]
    Audit internals: [Audit Domain, Shared, Catalog Domain, Customer Domain, Note Domain, Order Domain, Pricing Domain, Purchasing Domain, Reporting Domain, Review Domain, Current user]

    Catalog Domain: [Catalog internals, Shared, Audit Domain, Customer Domain, Note Domain, Order Domain, Pricing Domain, Purchasing Domain, Reporting Domain, Review Domain, Current user]
    Catalog internals: [Catalog Domain, Shared, Audit Domain, Customer Domain, Note Domain, Order Domain, Pricing Domain, Purchasing Domain, Reporting Domain, Review Domain, Current user]

    Customer Domain: [Customer internals, Shared, Current user, Audit Domain, Catalog Domain, Note Domain, Order Domain, Pricing Domain, Purchasing Domain, Reporting Domain, Review Domain]
    Customer internals: [Customer Domain, Shared, Current user, Audit Domain, Catalog Domain, Note Domain, Order Domain, Pricing Domain, Purchasing Domain, Reporting Domain, Review Domain]
    Current user: [Customer Domain, Shared]

    Note Domain: [Note internals, Shared, Audit Domain, Catalog Domain, Customer Domain, Order Domain, Pricing Domain, Purchasing Domain, Reporting Domain, Review Domain, Current user]
    Note internals: [Note Domain, Shared, Audit Domain, Catalog Domain, Customer Domain, Order Domain, Pricing Domain, Purchasing Domain, Reporting Domain, Review Domain, Current user]

    Order Domain: [Order internals, Shared, Audit Domain, Catalog Domain, Customer Domain, Note Domain, Pricing Domain, Purchasing Domain, Reporting Domain, Review Domain, Current user]
    Order internals: [Order Domain, Shared, Audit Domain, Catalog Domain, Customer Domain, Note Domain, Pricing Domain, Purchasing Domain, Reporting Domain, Review Domain, Current user]

    Pricing Domain: [Pricing internals, Shared, Audit Domain, Catalog Domain, Customer Domain, Note Domain, Order Domain, Purchasing Domain, Reporting Domain, Review Domain, Current user]
    Pricing internals: [Pricing Domain, Shared, Audit Domain, Catalog Domain, Customer Domain, Note Domain, Order Domain, Purchasing Domain, Reporting Domain, Review Domain, Current user]

    Purchasing Domain: [Purchasing internals, Shared, Audit Domain, Catalog Domain, Customer Domain, Note Domain, Order Domain, Pricing Domain, Reporting Domain, Review Domain, Current user]
    Purchasing internals: [Purchasing Domain, Shared, Audit Domain, Catalog Domain, Customer Domain, Note Domain, Order Domain, Pricing Domain, Reporting Domain, Review Domain, Current user]

    Reporting Domain: [Reporting internals, Shared, Audit Domain, Catalog Domain, Customer Domain, Note Domain, Order Domain, Pricing Domain, Purchasing Domain, Review Domain, Current user]
    Reporting internals: [Reporting Domain, Shared, Audit Domain, Catalog Domain, Customer Domain, Note Domain, Order Domain, Pricing Domain, Purchasing Domain, Review Domain, Current user]

    Review Domain: [Review internals, Shared, Audit Domain, Catalog Domain, Customer Domain, Note Domain, Order Domain, Pricing Domain, Purchasing Domain, Reporting Domain, Current user]
    Review internals: [Review Domain, Shared, Audit Domain, Catalog Domain, Customer Domain, Note Domain, Order Domain, Pricing Domain, Purchasing Domain, Reporting Domain, Current user]

    Home internals: [Shared, Audit Domain, Catalog Domain, Customer Domain, Note Domain, Order Domain, Pricing Domain, Purchasing Domain, Reporting Domain, Review Domain, Current user]

  # Imports that break the rules and are waiting for a decision (issue #36). Each entry says why it is still here.
  # Remove an entry when its import is fixed: this list must only get shorter.
  skip_violations:
    # A controller or handler calls another context's handler or service. Decide per case: move the orchestration
    # into the owning context, trigger it through a domain event, or record a named exception.
    App\Customer\UI\Http\Controller\CustomerController:
      - App\Reporting\Application\Handler\Report\CustomerProfileInsightsHandler
    App\Order\Application\Handler\AllocateOrderHandler:
      - App\Purchasing\Application\Service\OrderAllocator
    App\Order\UI\Http\Controller\OrderItemController:
      - App\Purchasing\Application\Command\PurchaseOrderItem\CreatePurchaseOrderItem
      - App\Purchasing\Application\Handler\PurchaseOrderItem\CreatePurchaseOrderItemHandler

    # Demo orders are built with Customer's random user and address factories, which are infrastructure.
    App\Order\Application\Service\DemoOrderCreator:
      - App\Customer\Infrastructure\Factory\RandomUserFactory
      - App\Customer\Infrastructure\Factory\RandomAddressFactory

    # Order and Purchasing repositories take Reporting's report criteria, so the dependency runs backwards, and the
    # Reporting handlers call those methods on the Doctrine class because the interface cannot name Reporting's
    # criteria. Both sides are fixed together once the criteria or the query has a home.
    App\Order\Infrastructure\Persistence\Doctrine\CustomerOrderDoctrineRepository:
      - App\Reporting\Application\Report\OverdueOrderReportCriteria
    App\Reporting\Application\Handler\Report\OverdueOrdersReportHandler:
      - App\Order\Infrastructure\Persistence\Doctrine\CustomerOrderDoctrineRepository
    App\Purchasing\Infrastructure\Persistence\Doctrine\PurchaseOrderItemDoctrineRepository:
      - App\Reporting\Application\Report\PoItemPerformanceReportCriteria
    App\Reporting\Application\Handler\Report\PoItemPerformanceReportHandler:
      - App\Purchasing\Infrastructure\Persistence\Doctrine\PurchaseOrderItemDoctrineRepository
