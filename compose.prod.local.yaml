# ========================================
# Docker Compose: Local production configuration
# ========================================
# This file is used for overrides during local production builds/testing
# It is NOT used in "real" production (e.g. on the actual production server)

x-local-env: &local-env
  MAILER_DSN: smtp://mailer:1025
  # Browsers refuse a __Secure- cookie from plain HTTP, and the Mercure bundle refuses to set one
  MERCURE_COOKIE_NAME: mercure_access_token

services:
  # --- RabbitMQ Message Broker (Prod local, only with the rabbitmq profile) ---
  rabbitmq:
    ports:
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"    # RabbitMQ Management UI (localhost only)


  # --- PHP Application (Prod local) ---
  php:
    environment:
      <<: *local-env
    ports: !override
      - "127.0.0.1:8000:80"   # Fixed port for local testing


  # --- Messenger Worker (Prod local) ---
  messenger:
    environment:
      <<: *local-env
    # Only the async queue, so the scheduled jobs (simulation, a real backup) never run on a local machine
    command: sh -c "php bin/console messenger:consume async --time-limit=3600 --sleep=5"
    # No backup runs here, and the server's backups directory does not exist on a local machine
    volumes: !reset []


  # --- PhpMyAdmin and Mailpit (Prod local Tools): the development definitions ---
  # The --env-file of make up-prod-local replaces .env, so their ports are the defaults (8080, 1025, 8025).
  phpmyadmin:
    extends:
      file: compose.override.yaml
      service: phpmyadmin

  mailer:
    extends:
      file: compose.override.yaml
      service: mailer
