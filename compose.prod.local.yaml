# ========================================
# Docker Compose: Local production configuration
# ========================================
# This file is used for overrides during local production builds/testing
# It is NOT used in "real" production (e.g. on the actual production server)

x-mailer-env: &mailer-env
  MAILER_DSN: smtp://mailer:1025

services:
  # --- RabbitMQ Message Broker (Prod local, only with the rabbitmq profile) ---
  rabbitmq:
    ports:
      - "15672:15672"    # RabbitMQ Management UI (dev)


  # --- PHP Application (Prod local) ---
  php:
    environment:
      <<: *mailer-env


    # --- Messenger Worker (Prod local) ---
  messenger:
    environment:
      <<: *mailer-env


  # --- Cron Jobs (Prod) ---
  cron:
    environment:
      <<: *mailer-env
    # Prevent cron from running real jobs on local machine
    command: /bin/sh -c 'printenv | grep -v "no_proxy" > /etc/environment && tail -f /dev/null'
    healthcheck:
      test: [ "CMD-SHELL", "ps aux | grep -q '[t]ail -f /dev/null'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  # --- Nginx Webserver (Prod local) ---
  nginx:
    ports:
      - "127.0.0.1:8000:80"   # Override to fixed port for local testing


  # --- PhpMyAdmin and Mailpit (Prod local Tools): the development definitions ---
  # The --env-file of make up-prod-local replaces .env, so their ports are the defaults (8080, 1025, 8025).
  phpmyadmin:
    extends:
      file: compose.override.yaml
      service: phpmyadmin

  mailer:
    extends:
      file: compose.override.yaml
      service: mailer
