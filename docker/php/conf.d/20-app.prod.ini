; No opcache.preload. In worker mode the app stays loaded between requests, so preloading gains little, and
; PHP 8.5 breaks a preloaded anonymous class once a worker restarts (FRANKENPHP_LOOP_MAX): the compiled
; container's LazyClosure adapters (Mercure's token factory, the error controller) lose their interface and
; every page fails with a TypeError. See ADR 016.
opcache.validate_timestamps = 0
